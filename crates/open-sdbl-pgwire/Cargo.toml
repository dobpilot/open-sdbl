[package]
name = "open-sdbl-pgwire"
version = "0.11.0"
edition = "2024"
rust-version = "1.85"
description = "PostgreSQL wire-protocol gateway that accepts SDBL for open-sdbl"
license = "MIT"
repository = "https://github.com/dobpilot/open-sdbl"

[lib]
name = "open_sdbl_pgwire"
path = "src/lib.rs"

[features]
fuzzing = []

[dependencies]
open-sdbl = { path = "../..", version = "0.11.0" }
open-sdbl-db = { path = "../open-sdbl-db", version = "0.11.0" }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
zeroize = "1.9.0"

[dev-dependencies]
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
