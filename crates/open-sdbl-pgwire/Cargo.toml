[package]
name = "open-sdbl-pgwire"
version = "0.10.1"
edition = "2024"
rust-version = "1.85"
description = "PostgreSQL wire-protocol gateway that accepts SDBL for open-sdbl"
license = "MIT"
repository = "https://github.com/dobpilot/open-sdbl"

[lib]
name = "open_sdbl_pgwire"
path = "src/lib.rs"

[features]
fuzzing = []

[dependencies]
open-sdbl = { path = "../..", version = "0.10.1" }
open-sdbl-db = { path = "../open-sdbl-db", version = "0.10.1" }
percent-encoding = "2.3"
ring = "0.17.14"
roxmltree = "0.20.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
xmlparser = "0.13.6"
zeroize = "1.9.0"

[dev-dependencies]
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
