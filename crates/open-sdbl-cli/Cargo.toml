[package]
name = "open-sdbl-cli"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
description = "Command-line applications for open-sdbl"
license = "MIT"
repository = "https://github.com/dobpilot/open-sdbl"
publish = false

[[bin]]
name = "open-sdbl"
path = "src/main.rs"
doc = false

[dependencies]
open-sdbl = { path = "../.." }
open-sdbl-db = { path = "../open-sdbl-db" }
rustyline = { version = "18.0.1", default-features = false }
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
unicode-width = "0.2.2"
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
