[package]
name = "open-sdbl-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Command-line applications for open-sdbl"
license = "GPL-3.0-only"
repository = "https://github.com/dobpilot/open-sdbl"
publish = false

[[bin]]
name = "open-sdbl"
path = "src/main.rs"
doc = false

[dependencies]
futures-util = "0.3.34"
moka = { version = "0.12.16", features = ["future"] }
open-sdbl = { path = "../.." }
rustyline = { version = "18.0.1", default-features = false }
tiberius = { version = "0.12.3", default-features = false, features = ["rustls", "tds73"] }
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-postgres = "0.7.18"
tokio-util = { version = "0.7.16", features = ["compat"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
