[package]
name = "open-sdbl-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Command-line applications for open-sdbl"
license = "MIT"
repository = "https://github.com/dobpilot/open-sdbl"
publish = false

[[bin]]
name = "open-sdbl"
path = "src/main.rs"
doc = false

[dependencies]
futures-util = "0.3.34"
open-sdbl = { path = "../.." }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.2"
rustyline = { version = "18.0.1", default-features = false }
tiberius = { version = "0.12.3", default-features = false, features = ["native-tls", "tds73"] }
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["native-certs", "ring"] }
tokio-util = { version = "0.7.16", features = ["compat"] }
unicode-width = "0.2.2"
webpki-roots = "1.0.6"
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
