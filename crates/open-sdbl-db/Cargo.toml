[package]
name = "open-sdbl-db"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "Database layer for open-sdbl: sessions, metadata acquisition and access rights"
license = "MIT"
repository = "https://github.com/dobpilot/open-sdbl"
publish = false

[lib]
name = "open_sdbl_db"
path = "src/lib.rs"

[dependencies]
futures-util = "0.3.34"
open-sdbl = { path = "../.." }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.2"
tiberius = { version = "0.12.3", default-features = false, features = ["native-tls", "tds73"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["native-certs", "ring"] }
tokio-util = { version = "0.7.16", features = ["compat"] }
webpki-roots = "1.0.6"
zeroize = "1.9.0"
