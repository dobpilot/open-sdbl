[package]
name = "open-sdbl-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[lib]
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
open-sdbl = { path = ".." }
open-sdbl-pgwire = { path = "../crates/open-sdbl-pgwire", features = ["fuzzing"] }

[[bin]]
name = "inflate"
path = "fuzz_targets/inflate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compile_query"
path = "fuzz_targets/compile_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pgwire_frontend"
path = "fuzz_targets/pgwire_frontend.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pgwire_catalog_sql"
path = "fuzz_targets/pgwire_catalog_sql.rs"
test = false
doc = false
bench = false

# Keep fuzz-only dependencies and targets outside the production workspace.
[workspace]
members = ["."]
resolver = "3"

[profile.release]
debug = 1
